<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
  
     <div class="images">
        <div class="logo">
            <h2> Odin project</h2>
            <img src="Form/odin-lined.png" alt="">
           
        </div>
     </div>
    <div class="container">
          <form action="">
        <h2> Lets do this </h2>

     <div class="form-group">
            <label for="first-name">First-name</label>
            <input type="text" name="first-name" id="first-name" placeholder="Enter your first name">
    </div>
    <div class="form-group">
            <label for="last-name">Last-name</label>
            <input type="text" name="last-name" id="last-name" placeholder="Enter your last name">
    </div>
     <div class="form-group">
         <label for="email">Email</label>
        <input type="email" id="email" required>
     </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required>
     </div>
    <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone">
     </div>
     <button class="CreateBtn"> Create Button </button>
      <div class="login">
      <p> Already have an account?</p>
      <a href="#">Login </a>
  </div>
  
  </div>
 

  
  
</body>
</html>
